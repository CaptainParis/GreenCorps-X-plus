plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'java'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// -Pshareable is accepted for parity with the dev build; it changes nothing here.
def shareableBuild = project.hasProperty('shareable')

repositories {
	mavenCentral()
	maven { url = 'https://maven.fabricmc.net/' }
	maven { url = 'https://maven.meteordev.org/releases' }
	maven { url = 'https://maven.meteordev.org/snapshots' }
	maven {
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
}

def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
	localFile.withReader('UTF-8') { localProps.load(it) }
}
def instanceMods = localProps.getProperty('instance.mods', '../mods')

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modImplementation("meteordevelopment:meteor-client:${project.meteor_version}")

	// Soft-deps from Modrinth: compile only, never shipped.
	modCompileOnly "maven.modrinth:xaeros-minimap:fabric-1.21.4-26.1.4"
	modCompileOnly "maven.modrinth:xaeros-world-map:fabric-1.21.4-1.41.2"
	// Baritone API for Timed Commands (# commands). Not shipped.
	modCompileOnly "meteordevelopment:baritone:${project.minecraft_version}-SNAPSHOT"

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	// XaeroPlus bundles sqlite-jdbc (relocated): the history backfill test reads real databases with it.
	testRuntimeOnly fileTree(dir: instanceMods, include: 'XaeroPlus-*.jar')
}

test {
	useJUnitPlatform()
}

// Pre-existing backup unit tests no longer match ObjectStore/Retention APIs.
tasks.named('compileTestJava', JavaCompile).configure {
	exclude 'dev/greencorps/backup/**'
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

def buildFlagsDir = layout.buildDirectory.dir('generated/sources/buildFlags/java')
tasks.register('generateBuildFlags') {
	inputs.property 'shareable', shareableBuild
	outputs.dir buildFlagsDir
	doLast {
		def pkg = buildFlagsDir.get().asFile.toPath().resolve('dev/greencorps')
		pkg.toFile().mkdirs()
		pkg.resolve('BuildFlags.java').toFile().text = """\
package dev.greencorps;

/** Generated by Gradle. {@code SHAREABLE=true} when built with {@code -Pshareable}. */
public final class BuildFlags {
	public static final boolean SHAREABLE = ${shareableBuild};
	private BuildFlags() {}
}
"""
	}
}

sourceSets.main.java.srcDir buildFlagsDir

tasks.named('compileJava', JavaCompile).configure {
	dependsOn 'generateBuildFlags'
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
	manifest {
		attributes(
			'Built-By': '',
			'Implementation-Vendor': 'QOLARR'
		)
	}
}

tasks.named('remapJar').configure {
	manifest {
		attributes(
			'Built-By': '',
			'Implementation-Vendor': 'QOLARR'
		)
	}
}
